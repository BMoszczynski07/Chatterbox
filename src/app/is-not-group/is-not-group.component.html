<button
  [routerLink]="
    '/user/' +
    chatService.loadedConversation.conversationparticipants_conversation
      .ConversationParticipants[0].conversationparticipants_user.unique_id
  "
  class="main__computer-logo__overlay"
>
  <div class="main__computer-logo__container">
    <img
      [src]="
        chatService.loadedConversation.conversationparticipants_conversation
          .ConversationParticipants[0].conversationparticipants_user.profile_pic
      "
      class="main__computer-user-logo"
      alt="A"
    />
  </div>
</button>
